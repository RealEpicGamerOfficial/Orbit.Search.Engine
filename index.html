<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Search Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom Styles for Orbital Animations */
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes orbit-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        .animate-orbit { animation: orbit 60s linear infinite; }
        .animate-orbit-reverse { animation: orbit-reverse 80s linear infinite; }
        .animate-orbit-fast { animation: orbit 30s linear infinite; }
        
        /* Custom scrollbar for settings modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen bg-zinc-950 text-white font-sans overflow-hidden relative flex flex-col items-center justify-center selection:bg-indigo-500/30">

    <!-- Settings Button -->
    <button id="settingsBtn" class="absolute top-6 right-6 text-zinc-400 hover:text-white transition-colors bg-zinc-900/50 p-2.5 rounded-xl border border-white/10 hover:border-white/20 backdrop-blur-md shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/50 z-50">
        <i data-lucide="settings" class="w-5 h-5"></i>
    </button>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-zinc-900 border border-white/10 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative animate-in fade-in zoom-in-95 duration-200">
            <button id="closeSettingsBtn" class="absolute top-5 right-5 text-zinc-400 hover:text-white transition-colors focus:outline-none">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                <i data-lucide="settings" class="w-6 h-6 text-indigo-400"></i> Settings
            </h2>
            
            <div class="space-y-6 max-h-[65vh] overflow-y-auto pr-2">
                
                <!-- Defaults Section -->
                <div>
                    <h3 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3">Defaults</h3>
                    <div class="space-y-4 bg-zinc-950/40 p-4 rounded-xl border border-white/5">
                        <div class="space-y-2 relative">
                            <label class="text-sm font-medium text-zinc-300">Search Engine</label>
                            <div class="relative">
                                <select id="defaultEngineSelect" class="w-full bg-zinc-800 border border-white/10 rounded-xl pl-4 pr-10 py-3 text-white outline-none focus:border-indigo-500 transition-colors appearance-none cursor-pointer">
                                    <!-- Options injected by JS -->
                                </select>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            </div>
                        </div>

                        <div class="flex items-center justify-between py-1">
                            <label class="text-sm font-medium text-zinc-300">Theme</label>
                            <span class="text-sm text-zinc-400 bg-zinc-800 px-3 py-1 rounded-lg border border-white/5">Dark</span>
                        </div>

                        <div class="flex items-center justify-between py-1">
                            <label for="newTabToggle" class="text-sm font-medium text-zinc-300 cursor-pointer">Results In New Tab</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="newTabToggle" class="sr-only peer">
                                <div class="w-11 h-6 bg-zinc-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Privacy and Security Section -->
                <div>
                    <h3 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3">Privacy and Security</h3>
                    <div class="space-y-4 bg-zinc-950/40 p-4 rounded-xl border border-white/5">
                        <div class="flex items-center justify-between py-1">
                            <label for="enforceStartpageToggle" class="text-sm font-medium text-zinc-300 cursor-pointer">Enforce using Startpage</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="enforceStartpageToggle" class="sr-only peer">
                                <div class="w-11 h-6 bg-zinc-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <label for="enforceHttpsToggle" class="text-sm font-medium text-zinc-300 cursor-pointer">Enforce using HTTPS</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="enforceHttpsToggle" class="sr-only peer" checked>
                                <div class="w-11 h-6 bg-zinc-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- SafeSearch, Filtering, LightFilter Compatibility -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">SafeSearch & Filtering</h3>
                        <span class="text-[10px] font-medium text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-md">Coming Soon with LightFilter</span>
                    </div>
                    <div class="space-y-4 bg-zinc-950/40 p-4 rounded-xl border border-white/5 opacity-80">
                        <div class="flex items-center justify-between py-1">
                            <label class="text-sm font-medium text-zinc-300">SafeSearch</label>
                            <span class="text-xs font-semibold text-indigo-300 bg-indigo-500/20 px-2.5 py-1 rounded-lg border border-indigo-500/30">On (Enforced)</span>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <label for="filterSlangToggle" class="text-sm font-medium text-zinc-400 cursor-not-allowed">Filter Slang and "Brainrot"</label>
                            <label class="relative inline-flex items-center cursor-not-allowed">
                                <input type="checkbox" id="filterSlangToggle" class="sr-only peer" disabled>
                                <div class="w-11 h-6 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-600 after:border-zinc-700 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <label for="filterAbbrevToggle" class="text-sm font-medium text-zinc-400 cursor-not-allowed">Filter Abbreviations and Common Bypasses</label>
                            <label class="relative inline-flex items-center cursor-not-allowed">
                                <input type="checkbox" id="filterAbbrevToggle" class="sr-only peer" disabled>
                                <div class="w-11 h-6 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-600 after:border-zinc-700 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <label for="filterMaliciousToggle" class="text-sm font-medium text-zinc-400 cursor-not-allowed">Filter Malicious and Misleading Sites</label>
                            <label class="relative inline-flex items-center cursor-not-allowed">
                                <input type="checkbox" id="filterMaliciousToggle" class="sr-only peer" disabled>
                                <div class="w-11 h-6 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-600 after:border-zinc-700 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <label for="filterExplicitToggle" class="text-sm font-medium text-zinc-400 cursor-not-allowed">Filter Explicit Sites and Content</label>
                            <label class="relative inline-flex items-center cursor-not-allowed">
                                <input type="checkbox" id="filterExplicitToggle" class="sr-only peer" disabled>
                                <div class="w-11 h-6 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-600 after:border-zinc-700 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                            </label>
                        </div>
                    </div>
                </div>

            </div>

            <div class="mt-8 flex justify-end">
                <button id="saveSettingsBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl font-medium transition-all duration-200 shadow-lg shadow-indigo-500/20 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-zinc-900">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Abstract Background Orbits -->
    <div class="absolute inset-0 z-0 flex items-center justify-center opacity-30 pointer-events-none">
        <div class="absolute w-[800px] h-[800px] border border-indigo-500/20 rounded-full animate-orbit"></div>
        <div class="absolute w-[600px] h-[600px] border border-purple-500/20 rounded-full animate-orbit-reverse"></div>
        <div class="absolute w-[400px] h-[400px] border border-blue-500/10 rounded-full animate-orbit-fast"></div>
        <!-- Glow behind center -->
        <div class="absolute w-96 h-96 bg-indigo-600/10 blur-[100px] rounded-full"></div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 w-full max-w-4xl px-6 flex flex-col items-center mt-[-10vh]">
        
        <!-- Header / Logo -->
        <div class="mb-12 flex flex-col items-center gap-4">
            <div class="relative flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-purple-600/20 border border-white/10 backdrop-blur-md shadow-[0_0_30px_rgba(99,102,241,0.2)]">
                <i data-lucide="orbit" class="w-12 h-12 text-indigo-400"></i>
            </div>
            <h1 class="text-5xl md:text-6xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-indigo-300 drop-shadow-sm">
                Orbit Search
            </h1>
            <p class="text-zinc-400 text-lg font-medium tracking-wide">Explore the web. Faster.</p>
        </div>

        <!-- Central Search Bar Container -->
        <form id="searchForm" class="w-full max-w-2xl relative group mb-8">
            <div id="searchContainer" class="relative flex items-center w-full h-16 bg-zinc-900/50 backdrop-blur-xl border border-white/10 focus-within:border-indigo-500/60 focus-within:shadow-[0_0_25px_rgba(99,102,241,0.15)] rounded-full shadow-2xl transition-all duration-300 px-2 overflow-hidden">
                
                <!-- Dynamic Engine Icon -->
                <div class="pl-4 pr-3 flex items-center justify-center" id="currentEngineIconContainer">
                    <!-- Icon injected here -->
                </div>

                <!-- Input Field -->
                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search..."
                    class="flex-1 h-full bg-transparent border-none outline-none text-xl text-white px-2 placeholder:text-zinc-600 w-full"
                    autocomplete="off"
                    autofocus
                />

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="h-12 w-12 mr-1 flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-zinc-900"
                >
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </div>
        </form>

        <!-- Visible Engine Selectors & Extensions -->
        <div class="w-full flex flex-col items-center space-y-8">
            <!-- Core Engines -->
            <div class="flex flex-col items-center space-y-3">
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider flex items-center gap-2"><i data-lucide="globe" class="w-3 h-3"></i> Search Engines</p>
                <div id="engineGrid" class="flex flex-wrap justify-center gap-3 max-w-3xl">
                    <!-- Engine buttons injected here -->
                </div>
            </div>
            
            <!-- Extensions -->
            <div class="flex flex-col items-center space-y-3">
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider flex items-center gap-2"><i data-lucide="blocks" class="w-3 h-3"></i> Search Extensions</p>
                <div id="extensionGrid" class="flex flex-wrap justify-center gap-3 max-w-3xl">
                    <!-- Extension buttons injected here -->
                </div>
            </div>
        </div>

    </div>

    <!-- Footer text -->
    <div class="absolute bottom-6 text-zinc-600 text-xs flex items-center gap-2">
        <i data-lucide="shield-check" class="w-4 h-4"></i> Secure Search Environment
    </div>

    <!-- Application Logic -->
    <script>
        // Fetch high-res favicons securely via Google's icon cache
        const getFavicon = (domain) => `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

        // Data Definitions
        const ENGINES = [
            // Core Engines
            { id: 'google', name: 'Google', domain: 'google.com', url: 'https://www.google.com/search?q=', color: 'text-blue-400', activeBg: 'bg-blue-500/20 border-blue-500/50 text-blue-100', placeholder: 'Search Google...', type: 'engine' },
            { id: 'bing', name: 'Bing', domain: 'bing.com', url: 'https://www.bing.com/search?q=', color: 'text-cyan-400', activeBg: 'bg-cyan-500/20 border-cyan-500/50 text-cyan-100', placeholder: 'Search Bing...', type: 'engine' },
            { id: 'duckduckgo', name: 'DuckDuckGo', domain: 'duckduckgo.com', url: 'https://duckduckgo.com/?q=', color: 'text-orange-500', activeBg: 'bg-orange-500/20 border-orange-500/50 text-orange-100', placeholder: 'Search DuckDuckGo...', type: 'engine' },
            { id: 'brave', name: 'Brave', domain: 'search.brave.com', url: 'https://search.brave.com/search?q=', color: 'text-orange-600', activeBg: 'bg-orange-600/20 border-orange-600/50 text-orange-100', placeholder: 'Search Brave...', type: 'engine' },
            { id: 'ecosia', name: 'Ecosia', domain: 'ecosia.org', url: 'https://www.ecosia.org/search?q=', color: 'text-green-500', activeBg: 'bg-green-500/20 border-green-500/50 text-green-100', placeholder: 'Search Ecosia...', type: 'engine' },
            { id: 'qwant', name: 'Qwant', domain: 'qwant.com', url: 'https://www.qwant.com/?q=', color: 'text-purple-500', activeBg: 'bg-purple-500/20 border-purple-500/50 text-purple-100', placeholder: 'Search Qwant...', type: 'engine' },
            { id: 'yahoo', name: 'Yahoo', domain: 'yahoo.com', url: 'https://search.yahoo.com/search?p=', color: 'text-purple-600', activeBg: 'bg-purple-600/20 border-purple-600/50 text-purple-100', placeholder: 'Search Yahoo...', type: 'engine' },
            { id: 'startpage', name: 'Startpage', domain: 'safe.startpage.com', url: 'https://safe.startpage.com/sp/search?query=', color: 'text-indigo-500', activeBg: 'bg-indigo-500/20 border-indigo-500/50 text-indigo-100', placeholder: 'Search Startpage...', type: 'engine' },
            
            // Extensions
            { id: 'wikipedia', name: 'Wikipedia', domain: 'wikipedia.org', url: 'https://en.wikipedia.org/wiki/Special:Search?search=', color: 'text-gray-100', activeBg: 'bg-zinc-700/50 border-zinc-500 text-white', placeholder: 'Search Wikipedia...', type: 'extension' },
            { id: 'reddit', name: 'Reddit', domain: 'reddit.com', url: 'https://www.reddit.com/search/?q=', color: 'text-orange-600', activeBg: 'bg-orange-600/20 border-orange-600/50 text-orange-100', placeholder: 'Search Reddit...', type: 'extension' },
            { id: 'youtube', name: 'YouTube', domain: 'youtube.com', url: 'https://www.youtube.com/results?search_query=', color: 'text-red-500', activeBg: 'bg-red-500/20 border-red-500/50 text-red-100', placeholder: 'Search YouTube videos...', type: 'extension' },
            { id: 'github', name: 'GitHub', domain: 'github.com', url: 'https://github.com/search?q=', color: 'text-gray-200', activeBg: 'bg-zinc-700/50 border-zinc-500 text-white', placeholder: 'Search GitHub repos...', type: 'extension' },
        ];

        // State loaded from LocalStorage (or defaults)
        let savedDefaultEngineId = localStorage.getItem('orbit_default_engine') || 'google';
        let openInNewTab = localStorage.getItem('orbit_new_tab') === 'true';
        let enforceStartpage = localStorage.getItem('orbit_enforce_startpage') === 'true';
        let enforceHttps = localStorage.getItem('orbit_enforce_https') !== 'false'; // default true

        // If Startpage is enforced, lock active engine to startpage
        if (enforceStartpage) {
            savedDefaultEngineId = 'startpage';
        }

        let activeEngine = ENGINES.find(e => e.id === savedDefaultEngineId) || ENGINES[0];

        // DOM Elements
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const engineGrid = document.getElementById('engineGrid');
        const extensionGrid = document.getElementById('extensionGrid');
        const currentEngineIconContainer = document.getElementById('currentEngineIconContainer');
        
        // Settings DOM Elements
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const defaultEngineSelect = document.getElementById('defaultEngineSelect');
        const newTabToggle = document.getElementById('newTabToggle');
        const enforceStartpageToggle = document.getElementById('enforceStartpageToggle');
        const enforceHttpsToggle = document.getElementById('enforceHttpsToggle');

        // Initialize App
        function init() {
            renderEngines();
            updateActiveUI();
            populateSettings();
            lucide.createIcons();
            searchInput.focus();
        }

        // Helper to render buttons
        function createButtonHTML(engine, isActive) {
            const baseClasses = "flex items-center gap-2 px-4 py-2 rounded-full border transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/50";
            const activeClasses = isActive 
                ? `${engine.activeBg} shadow-lg shadow-${engine.color.split('-')[1]}-500/10 scale-105` 
                : "bg-zinc-900/40 border-white/5 text-zinc-400 hover:bg-zinc-800/60 hover:text-white hover:border-white/20";
            
            const imgStyle = isActive ? "opacity-100 grayscale-0" : "opacity-60 grayscale group-hover:grayscale-0 group-hover:opacity-100";

            return `
                <button
                    type="button"
                    onclick="selectEngine('${engine.id}')"
                    class="group ${baseClasses} ${activeClasses}"
                >
                    <img src="${getFavicon(engine.domain)}" alt="${engine.name} icon" class="w-4 h-4 ${imgStyle} transition-all duration-300 rounded-sm">
                    <span class="text-sm font-semibold tracking-wide">${engine.name}</span>
                </button>
            `;
        }

        // Render the visible engine buttons
        function renderEngines() {
            const engines = ENGINES.filter(e => e.type === 'engine');
            const extensions = ENGINES.filter(e => e.type === 'extension');

            engineGrid.innerHTML = engines.map(engine => createButtonHTML(engine, activeEngine.id === engine.id)).join('');
            extensionGrid.innerHTML = extensions.map(engine => createButtonHTML(engine, activeEngine.id === engine.id)).join('');
        }

        // Update the main search bar UI when engine changes
        function updateActiveUI() {
            currentEngineIconContainer.innerHTML = `<img src="${getFavicon(activeEngine.domain)}" alt="${activeEngine.name} icon" class="w-6 h-6 rounded-md shadow-sm">`;
            searchInput.placeholder = activeEngine.placeholder;
        }

        // Handle selection
        window.selectEngine = function(engineId) {
            if (enforceStartpage && engineId !== 'startpage') {
                return; // Prevent changing if Startpage is enforced
            }
            activeEngine = ENGINES.find(e => e.id === engineId);
            renderEngines();
            updateActiveUI();
            searchInput.focus();
        };

        // Populate and Sync Settings Modal
        function populateSettings() {
            defaultEngineSelect.innerHTML = ENGINES.map(engine => 
                `<option value="${engine.id}">${engine.name}</option>`
            ).join('');
            
            defaultEngineSelect.value = savedDefaultEngineId;
            newTabToggle.checked = openInNewTab;
            enforceStartpageToggle.checked = enforceStartpage;
            enforceHttpsToggle.checked = enforceHttps;

            if (enforceStartpage) {
                defaultEngineSelect.value = 'startpage';
                defaultEngineSelect.disabled = true;
            } else {
                defaultEngineSelect.disabled = false;
            }
        }

        // Settings Modal Event Listeners
        settingsBtn.addEventListener('click', () => {
            populateSettings();
            settingsModal.classList.remove('hidden');
        });

        const closeSettings = () => settingsModal.classList.add('hidden');
        closeSettingsBtn.addEventListener('click', closeSettings);
        
        settingsModal.addEventListener('mousedown', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        enforceStartpageToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                defaultEngineSelect.value = 'startpage';
                defaultEngineSelect.disabled = true;
            } else {
                defaultEngineSelect.disabled = false;
            }
        });

        // Save Settings
        saveSettingsBtn.addEventListener('click', () => {
            const newDefault = enforceStartpageToggle.checked ? 'startpage' : defaultEngineSelect.value;
            const newTabPref = newTabToggle.checked;
            const newEnforceStartpage = enforceStartpageToggle.checked;
            const newEnforceHttps = enforceHttpsToggle.checked;

            // Save to localStorage
            localStorage.setItem('orbit_default_engine', newDefault);
            localStorage.setItem('orbit_new_tab', newTabPref.toString());
            localStorage.setItem('orbit_enforce_startpage', newEnforceStartpage.toString());
            localStorage.setItem('orbit_enforce_https', newEnforceHttps.toString());

            // Update app state
            savedDefaultEngineId = newDefault;
            openInNewTab = newTabPref;
            enforceStartpage = newEnforceStartpage;
            enforceHttps = newEnforceHttps;

            selectEngine(newDefault);
            closeSettings();
        });

        // Handle Search Submission
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let query = searchInput.value.trim();
            if (query) {
                let targetUrl = enforceStartpage ? 'https://safe.startpage.com/sp/search?query=' : activeEngine.url;
                let searchUrl = targetUrl + encodeURIComponent(query);
                
                if (enforceHttps) {
                    searchUrl = searchUrl.replace(/^http:\/\//i, 'https://');
                }

                if (openInNewTab) {
                    window.open(searchUrl, '_blank');
                } else {
                    window.location.href = searchUrl;
                }
            }
        });

        // Run Initialization
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
